name: Check links

# Once a month, visit every link on the site. If any are broken, open an issue listing them.
# Some university sites turn away automated visitors, so "forbidden" and "too many requests" don't count.

on:
  schedule:
    - cron: "0 16 1 * *"  # the 1st of every month
  workflow_dispatch:       # or run it by hand from the Actions tab

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Visit every link
        id: lychee
        uses: lycheeverse/lychee-action@v2.4.1
        with:
          args: >-
            --no-progress --max-retries 3 --timeout 30
            --accept 200..=299,403,429
            --exclude "localhost"
            lib/links.ts
          output: lychee-report.md
          fail: false

      - name: Report broken links in an issue
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5.0.1
        with:
          title: Broken links on EECS Links
          content-filepath: lychee-report.md
          labels: broken-links
